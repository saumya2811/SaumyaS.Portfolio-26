<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shimmy · Saumya Srivastava</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Playfair+Display:ital,wght@1,700&family=Jost:wght@300;400&display=swap">
<style>
:root{--paper:#F5F0E8;--ink:#2E2520;--soft:#857467;--red:#A8322A;--thin:'Cormorant Garamond',Georgia,serif;--tight:'Playfair Display',Georgia,serif;--sans:'Jost','Avenir Next',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:300 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:620px;margin:0 auto;padding:26px 24px 80px}
a.back{font:400 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;text-decoration:none;color:var(--soft)}
a.back:hover{color:var(--red)}
h1{margin:64px 0 0;font:italic 700 clamp(48px,9vw,64px)/.95 var(--tight);color:var(--red)}
h1 small{display:block;font:400 19px/1.4 var(--thin);font-style:normal;color:var(--ink);margin-top:10px}
.dek{margin:20px 0 0;font:italic 400 21px/1.5 var(--thin);max-width:460px}
.film{margin:38px 0 0;background:#FCFAF6;padding:9px 9px 34px;box-shadow:0 16px 30px -16px rgba(46,37,32,.5);position:relative}
.film video{display:block;width:100%;aspect-ratio:1;background:#FDECEA}
.film figcaption{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:italic 500 16px/1 var(--thin);color:var(--soft)}
.code{margin-top:34px;font-size:15px;color:var(--soft)}
.code a{display:inline-block;margin-top:10px;font:400 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;text-decoration:none;color:var(--red);border-bottom:1px solid currentColor;padding-bottom:5px}
</style></head>
<body><div class="page">
  <a class="back" href="outside-work.html#made">← Back</a>
  <h1>Shimmy<small>shimmy shimmy</small></h1>
  <p class="dek">I built my friends and me our own customized tiny social media over a weekend.</p>
  <figure class="film"><video controls playsinline preload="metadata" poster="img/outside/shimmy-poster.jpg" src="shimmy-walkthrough.mp4" aria-label="Walkthrough of Shimmy, narrated by Saumya"></video><figcaption>a walkthrough, in my voice</figcaption></figure>
  <p class="code">The code is free to use, change and share.<br><a href="https://github.com/saumya2811/shimmy-for-friends">Get it on GitHub →</a></p>
</div></body></html>
